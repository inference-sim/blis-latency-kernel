<title id="fig-ranks-title">How ranks are numbered and grouped, for tp 4, pcp 2, dp 2 on two 8-GPU nodes</title>

<figcaption>Sixteen GPUs at tp 4, pcp 2, dp 2. A group's members are as far apart as the product of the axes numbered inside its own: one for tensor parallelism, four (tp) for prefill-context parallelism, eight (tp × pcp) for data parallelism. Whether a group leaves its node, and so is priced at the network's speed rather than NVLink's, follows from that spacing, not from the group's size: the data-parallel group has two members and still crosses.</figcaption>
