<title id="fig-repos-title">The BLIS repositories, seen from blis-latency-kernel</title>
<desc id="fig-repos-desc">blis-latency-kernel imports blis-schemas for document types, loaders, validators and the Kernel interface. It reads model graphs, chips, fabrics and storage tiers from blis-catalog, and coefficient sets from blis-registry, as files. inference-sim, in pull request 1851, imports the kernel and calls it once per simulated step. Nothing imports in the other direction.</desc>
