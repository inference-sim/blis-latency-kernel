<figcaption>The model <code>deepseek-v3</code>, served in fp8 on 8 H200 GPUs at tensor-parallel width 8 (<code>testdata/aisimulate/deepseek-v3-h200-fp8-sglang-tp8.yaml</code>), every request decoding one token against a 4,096-token context. <b>Left:</b> the time each resource needs over one step. The bottleneck, the resource with the most time, is host from 1 to 2 requests and HBM from 4 to 256 requests. At one request host and SM are within 1% of each other (3.54 and 3.51 ms), so their lines coincide there. No collective leaves the node, so NIC carries nothing and is not drawn. <b>Right:</b> the step's two estimates, on the same scale: NoOverlap is the sum of the lines on the left, and Overlap lets each layer's resources work at once. Going from one request to 256 multiplies the step by about 6, and divides the time per request by about 45. Computed by this kernel at batch sizes that are powers of two, joined by straight lines.</figcaption>
