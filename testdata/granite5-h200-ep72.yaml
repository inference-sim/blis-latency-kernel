# The same deployment at a wider expert-parallel width, which is §2.1's second row.
# Nine nodes give 72 ranks; nothing else differs from granite5-h200-ep16.yaml, so a
# comparison between the two isolates expert-parallel width.
kind: Scenario
name: granite5-h200-ep72
engine_version: "0.29.0"

model: granite-5.0-230b-rl-preview
hardware: h200
fabric: ib-400g
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent]

cluster:
  nodes: 9
  gpus_per_node: 8

pools:
  - role: colocated
    nodes: 9
    parallel:
      tp: 8
      pp: 1
      dp: 9
      enable_expert_parallel: true
    engine:
      quantization: fp8
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
      speculative:
        method: mtp
        num_spec_tokens: 1
