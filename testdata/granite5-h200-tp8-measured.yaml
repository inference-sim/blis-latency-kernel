# The deployment of the published Granite-5 H200 capacity report, as a scenario.
#
# Recorded so the kernel can be scored against that report's measured results. The knobs
# are the ones the report itself states: tensor-parallel 8, vLLM 0.29.0, fp8 KV cache, one
# 8-GPU node. It differs from granite5-h200-ep16.yaml in having no expert parallelism and
# a single node, because that is what was run.
kind: Scenario
name: granite5-h200-tp8-measured
engine_version: "0.29.0"

model: granite-5.0-230b-rl-preview
hardware: h200
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent]

cluster:
  nodes: 1
  gpus_per_node: 8

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 32768
      max_num_seqs: 1024
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
