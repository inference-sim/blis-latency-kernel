# Upstream test inputs, fetched by scripts/fetch-testdata.sh rather than committed.
#
# One line per upstream: <dest under testdata> <repository> <release tag> <commit>
# followed by the paths copied out of it (shell globs, relative to the repository root).
# The commit is what is fetched and verified; the tag is for the reader. Bump a line,
# run the script, and run `go test ./...`: a renamed chip or coefficient is supposed to
# break the fixtures that name it.
# TEMPORARY: the catalog line pins the pushed head of inference-sim/blis-catalog#47 (Muse Spark), until it is released.
catalog  https://github.com/inference-sim/blis-catalog  pr47    1affd8f5cd7b45f0d7191f9b00d45e750d3bd83e  hardware/*.yaml networks/*.yaml devices/storage.yaml models/*/graph.yaml
# TEMPORARY: the registry line pins the pushed head of inference-sim/blis-registry#62 (Muse Spark), until it is released.
registry https://github.com/inference-sim/blis-registry pr62    76a4ca82227c1e9b2565c487dfd6519d363b449b  coefficients/*.yaml
