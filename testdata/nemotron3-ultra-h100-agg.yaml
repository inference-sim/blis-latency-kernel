# The aggregated (non-disaggregated) arm of the published Nemotron-3-Ultra sweep.
#
# Chosen from that report's six arms because it is the one a step-time model can be held
# to: no prefill/decode split, so every step this scenario prices is a step the engine
# actually ran, and the report records `preempt: 0` and near-zero `waiting` at every level,
# so nothing is queueing.
#
# The report states TP=8 on H100 across 24 GPUs, NVFP4 weights, and MTP depth 1. It does
# NOT state input or output lengths, max_num_seqs, max_model_len, or
# gpu_memory_utilization. Those are recorded here as the engine defaults with the omission
# noted, and the scorer says which of its inputs came from the report and which did not.
kind: Scenario
name: nemotron3-ultra-h100-agg
engine_version: "0.29.0"

model: nemotron-3-ultra-550b-a55b-nvfp4
hardware: h100
# Declared because a three-node cluster must name one, though no collective in this
# deployment crosses a node: the 24 GPUs run as three independent 8-GPU tensor-parallel
# replicas, so every group fits inside one node. The report states no fabric, and this is
# the common H100 choice.
fabric: ib-400g
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent]

cluster:
  nodes: 3
  gpus_per_node: 8

pools:
  - role: colocated
    # 24 GPUs as three 8-GPU tensor-parallel replicas, which is what "AGG x3" names.
    nodes: 3
    parallel:
      tp: 8
      pp: 1
      dp: 3
      enable_expert_parallel: false
    engine:
      cache_dtype: fp8
      # A hybrid stack's recurrent state. The report does not state the mode, so this is
      # the engine default: state sized per sequence rather than per position, which is
      # three orders of magnitude smaller than the alternative.
      mamba_cache_mode: none
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 131072
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
      speculative:
        method: mtp
        num_spec_tokens: 1
