# GLM-5 on one 8-GPU H200 node, as the AISimulate end-to-end accuracy snapshot records it.
#
# Every field below is stated by that snapshot's own topology record rather than inferred:
# framework sglang, precision fp8, serving aggregated, and the parallelism block
# {tp_size: 8, pp_size: 1, moe_tp_size: 8, moe_ep_size: 1, attention_dp_size: 1}. The
# moe_ep_size of 1 is why expert parallelism is off here — each rank holds every expert at a
# tensor-parallel slice, which is the case the kernel's expertTensorShards term covers.
#
# The snapshot does NOT state max_num_seqs, max_model_len, gpu_memory_utilization or the
# cudagraph mode. Those are recorded as engine defaults and the comparison does not depend on
# them: it scores the RATIO of step times across concurrency at a fixed deployment, and a
# constant cancels in a ratio.
kind: Scenario
name: glm5-h200-tp8
engine_version: "0.29.0"

model: glm-5
hardware: h200
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent]

cluster:
  nodes: 1
  gpus_per_node: 8

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 131072
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
